# databricks.yml — Databricks Asset Bundle configuration
# Deploy with: databricks bundle deploy --target dev

bundle:
  name: ecommerce-etl

variables:
  cluster_node_type:
    default: Standard_DS3_v2
  spark_version:
    default: 14.3.x-scala2.12

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-databricks-workspace>.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://<your-databricks-workspace>.azuredatabricks.net
    run_as:
      service_principal_name: ecommerce-etl-sp

resources:
  jobs:
    ecommerce_etl_pipeline:
      name: "E-Commerce ETL Pipeline"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # Daily at 06:00 UTC
        timezone_id: UTC
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - pattisiva0568@gmail.com

      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: notebooks/01_bronze_ingest
            base_parameters:
              env:             "${bundle.target}"
              pipeline_run_id: "{{run_id}}"
          new_cluster:
            spark_version: "${var.spark_version}"
            node_type_id:  "${var.cluster_node_type}"
            num_workers:   2
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
            libraries:
              - pypi:
                  package: requests>=2.31.0

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: notebooks/02_silver_transform
            base_parameters:
              env: "${bundle.target}"
          new_cluster:
            spark_version: "${var.spark_version}"
            node_type_id:  "${var.cluster_node_type}"
            num_workers:   2

        - task_key: gold_aggregate
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: notebooks/03_gold_aggregate
            base_parameters:
              env: "${bundle.target}"
          new_cluster:
            spark_version: "${var.spark_version}"
            node_type_id:  "${var.cluster_node_type}"
            num_workers:   2
            libraries:
              - maven:
                  coordinates: com.microsoft.azure:spark-mssql-connector_2.12:1.3.0-BETA
